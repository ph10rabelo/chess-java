<!DOCTYPE html>
<html>
<head>
    <title>Woodpecker Chess</title>
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white flex flex-col items-center p-10">
    <h1 class="text-4xl font-bold mb-8 text-cyan-400">Woodpecker Trainer</h1>
    
    <div class="flex gap-10">
        <div id="myBoard" style="width: 500px"></div>

        <div class="bg-slate-800 p-6 rounded-lg shadow-xl w-80">
            <h2 class="text-xl font-semibold mb-4">Puzzle Info</h2>
            <p>Rating: <span id="rating" class="text-yellow-400">----</span></p>
            <p>Themes: <span id="themes" class="text-sm italic">...</span></p>
            <div id="status" class="mt-4 p-2 rounded bg-slate-700 text-center">Waiting...</div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <script>
    var board = null;
    var game = new Chess(); 
    let solutionIndex = 0;
    let puzzleData = null;

    async function loadPuzzle() {
        try {
            const response = await fetch('/api/puzzles/daily');
            puzzleData = await response.json();
            solutionIndex = 0;

            const tempGame = new Chess();
            tempGame.load_pgn(puzzleData.game.pgn); 
            const history = tempGame.history({ verbose: true });
            
            tempGame.reset();
            for (let i = 0; i < puzzleData.puzzle.initialPly; i++) {
                tempGame.move(history[i]);
            }
            
            const initialFen = tempGame.fen();
            game.load(initialFen);
			
            const playerColor = (puzzleData.puzzle.initialPly % 2 === 0) ? 'black' : 'white';
            
            const config = {
                draggable: true,
                position: initialFen,
                orientation: playerColor,
                pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png',
                onDrop: handleMove
            };
            board = Chessboard('myBoard', config);
            
            document.getElementById('rating').innerText = puzzleData.puzzle.rating;
            document.getElementById('themes').innerText = puzzleData.puzzle.themes.join(", ");
            document.getElementById('status').innerText = "Waiting opponent move...";

            window.setTimeout(function() {
                const blunder = history[puzzleData.puzzle.initialPly];
                game.move(blunder);
                board.position(game.fen(), true);
                document.getElementById('status').innerText = "Find the movement.";
            }, 1000);

        } catch (error) {
            console.error("Erro:", error);
        }
    }

    function makeOpponentMove() {
        if (!puzzleData || solutionIndex >= puzzleData.puzzle.solution.length) return;

        const moveStr = puzzleData.puzzle.solution[solutionIndex];
        const source = moveStr.substring(0, 2);
        const target = moveStr.substring(2, 4);
        const promotionPiece = moveStr.length === 5 ? moveStr[4] : 'q';

        game.move({
            from: source,
            to: target,
            promotion: promotionPiece
        });

        board.position(game.fen(), true);
        solutionIndex++;
    }

    function handleMove(source, target) {
        if (!puzzleData) return 'snapback';

        const correctMove = puzzleData.puzzle.solution[solutionIndex];
        const promotionPiece = correctMove.length === 5 ? correctMove[4] : 'q';
            
        const move = game.move({
            from: source,
            to: target,
            promotion: promotionPiece
        });
        
        if (move === null) return 'snapback';
        
        const userMove = source + target;
        
        if (userMove === correctMove.substring(0, 4)) {
            solutionIndex++;
            if (solutionIndex === puzzleData.puzzle.solution.length) {
                document.getElementById('status').innerText = "Puzzle done.";
            } else {
                window.setTimeout(makeOpponentMove, 250);	
            }
        } else {
            game.undo();
            return 'snapback';
        }
    }

    $(document).ready(loadPuzzle);
</script>
</body>
</html>
